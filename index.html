<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مهراد مهری | درباره من</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#08153a; --bg2:#1b3f9a; --ink:#ffffff; --soft:#c5d2ee;
  --lilac:#ffb938; --peach:#ffb938; --mint:#ffe0a3; --card:rgba(255,255,255,.1);
  --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);
  line-height:1.9;overflow-x:hidden;
}
/* floating glow background */
.glow{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(160deg,#08153a 0%,#13307a 40%,#2a3a8f 62%,#7a5a3a 88%,#c98a2b 100%);background-size:100% 220%;animation:flow 24s ease-in-out infinite alternate}
.glow i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
.glow i:nth-child(1){width:460px;height:460px;background:#ffb938;top:-100px;right:-80px;opacity:.38}
.glow i:nth-child(2){width:420px;height:420px;background:#3b78ff;bottom:5%;left:-120px;animation-duration:28s;opacity:.5}
.glow i:nth-child(3){width:340px;height:340px;background:#ffb938;top:48%;right:25%;opacity:.22;animation-duration:34s}
@keyframes flow{to{background-position:0 100%}}
@keyframes drift{to{transform:translate(-60px,80px) scale(1.15)}}

nav{
  position:fixed;top:0;inset-inline:0;z-index:10;display:flex;justify-content:center;gap:6px;
  padding:14px 12px;backdrop-filter:blur(14px);background:rgba(7,19,48,.65);border-bottom:1px solid var(--line);
}
nav a{color:var(--soft);text-decoration:none;font-size:.95rem;padding:6px 16px;border-radius:99px;transition:.35s}
nav a:hover{color:var(--ink);background:var(--card)}

section{max-width:980px;margin:0 auto;padding:110px 24px 40px}
#hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-top:90px}

.hello{color:var(--mint);font-weight:300;font-size:1.3rem;opacity:0;animation:rise 1.2s .2s forwards}
h1{font-size:clamp(3rem,11vw,7rem);font-weight:900;line-height:1.25;margin:6px 0 18px;display:flex;gap:.28em;flex-wrap:wrap;justify-content:center}
h1 span{display:inline-block;opacity:0;transform:translateY(40px);
  background:linear-gradient(110deg,#ffffff 0%,#a9c6ff 30%,#ffe0a3 60%,#ffb938 100%);background-size:200% auto;animation:rise 1.4s cubic-bezier(.2,.8,.2,1) forwards,shine 7s 2s linear infinite;-webkit-background-clip:text;background-clip:text;color:transparent}
h1 span:nth-child(1){animation-delay:.5s}
h1 span:nth-child(2){animation-delay:.8s}
.chips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;opacity:0;animation:rise 1.2s 1.3s forwards}
.chip{padding:8px 20px;border:1px solid var(--line);background:linear-gradient(120deg,rgba(80,130,255,.25),rgba(255,185,56,.18));border-radius:99px;color:var(--ink);backdrop-filter:blur(8px)}
.scroll{margin-top:56px;width:26px;height:44px;border:2px solid var(--soft);border-radius:20px;position:relative;opacity:0;animation:rise 1s 2s forwards}
.scroll::after{content:"";position:absolute;top:8px;left:50%;width:4px;height:8px;margin-left:-2px;background:var(--lilac);border-radius:4px;animation:wheel 1.8s ease-in-out infinite}
.scroll-text{margin-top:12px;color:var(--soft);font-weight:300;font-size:.95rem;opacity:0;animation:rise 1s 2.2s forwards,pulse 2.4s 3.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(16px)}}
@keyframes shine{to{background-position:200% center}}
@keyframes rise{to{opacity:1;transform:none}}

h2{font-size:clamp(1.8rem,5vw,2.6rem);font-weight:800;margin-bottom:26px}
h2::after{content:"";display:block;width:64px;height:4px;border-radius:4px;margin-top:8px;background:linear-gradient(90deg,#5c93ff,#ffb938)}
p.lead{color:var(--soft);font-size:1.12rem;max-width:680px}

/* scroll reveal */
.reveal{opacity:0;transform:translateY(36px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.reveal.on{opacity:1;transform:none}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:34px}
.card{
  background:linear-gradient(145deg,rgba(80,130,255,.22),rgba(255,185,56,.14));border:1px solid var(--line);border-radius:26px;padding:26px;
  backdrop-filter:blur(10px);transition:transform .5s cubic-bezier(.2,.8,.2,1),border-color .5s,background .5s;
}
.card:hover{transform:translateY(-8px);border-color:var(--lilac);background:linear-gradient(145deg,rgba(80,130,255,.32),rgba(255,185,56,.24))}
.card small{color:var(--soft);display:block;font-weight:300}
.card strong{font-size:1.35rem;font-weight:600}
.card .emoji{font-size:2rem;display:block;margin-bottom:6px;animation:bob 4s ease-in-out infinite}
.card:nth-child(2) .emoji{animation-delay:.6s}
.card:nth-child(3) .emoji{animation-delay:1.2s}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}


/* social */
.social{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;margin-top:38px}
.soc{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  text-align:center;text-decoration:none;color:var(--ink);padding:38px 22px 32px;border-radius:30px;
  background:linear-gradient(160deg,rgba(80,130,255,.24),rgba(255,185,56,.14));border:1px solid var(--line);
  backdrop-filter:blur(12px);transition:transform .6s cubic-bezier(.2,.8,.2,1),border-color .6s,box-shadow .6s;
}
.soc::after{
  content:"";position:absolute;top:0;bottom:0;width:60%;left:-80%;transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);transition:left 1s ease;
}
.soc:hover{transform:translateY(-10px);border-color:var(--lilac);box-shadow:0 22px 50px rgba(255,185,56,.18),0 0 0 1px rgba(255,185,56,.25)}
.soc:hover::after{left:130%}
.soc:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
.ico{position:relative;width:78px;height:78px;border-radius:50%;display:grid;place-items:center}
.ico::before{
  content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(#5c93ff,#ffb938,#5c93ff);animation:spin 6s linear infinite;
}
.ico::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(135deg,#bcd2ff,#ffe0a3 55%,#ffb938)}
.ico svg{position:relative;z-index:1;width:34px;height:34px;fill:#0b1b45;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.soc:hover .ico svg{transform:scale(1.18) rotate(-8deg)}
.soc strong{font-size:1.35rem;font-weight:600;line-height:1.4}
.soc small{display:block;color:var(--soft);font-weight:300;line-height:1.4;margin-top:-10px}
@keyframes spin{to{transform:rotate(360deg)}}

footer{text-align:center;color:var(--soft);padding:80px 20px 50px;font-weight:300}
footer b{color:var(--ink);font-weight:600}

@media (prefers-reduced-motion:reduce){
  *{animation-iteration-count:1!important;animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}
}
</style>
</head>
<body>
<div class="glow" aria-hidden="true"><i></i><i></i><i></i></div>

<nav>
  <a href="#hero">خانه</a>
  <a href="#about">مشخصات من</a>
  <a href="#contact">ارتباط با من</a>
</nav>

<section id="hero">
  <div class="hello">سلام، من</div>
  <h1><span>مهراد</span><span>مهری</span></h1>
  <div class="chips">
    <div class="chip">دانش‌آموز کلاس هفتم</div>
    <div class="chip">مدرسه عرفان متوسطه ۱</div>
  </div>
  <div class="scroll" aria-hidden="true"></div>
  <div class="scroll-text">اسکورول کنید</div>
</section>

<section id="about">
  <h2 class="reveal">مشخصات من</h2>
  <div class="grid">
    <div class="card reveal"><span class="emoji">🙋‍♂️</span><small>نام من</small><strong>مهراد مهری</strong></div>
    <div class="card reveal"><span class="emoji">🏫</span><small>مدرسه</small><strong>عرفان متوسطه ۱</strong></div>
    <div class="card reveal"><span class="emoji">📚</span><small>پایه تحصیلی</small><strong>هفتم</strong></div>
  </div>
</section>

<section id="contact">
  <h2 class="reveal">ارتباط با من</h2>
  <div class="social">
    <a class="soc reveal" href="https://wa.link/tgz4vl" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.615.136-.135.301-.345.451-.52.146-.181.194-.301.297-.497.1-.21.05-.375-.025-.524-.075-.15-.67-1.62-.922-2.206-.24-.584-.487-.51-.67-.51-.172-.008-.371-.01-.57-.01-.2 0-.523.074-.797.359-.273.3-1.045 1.02-1.045 2.475s1.07 2.865 1.219 3.075c.149.195 2.105 3.195 5.1 4.485.714.3 1.27.48 1.704.629.714.227 1.365.195 1.88.121.574-.091 1.767-.721 2.016-1.426.255-.705.255-1.29.18-1.425-.074-.135-.27-.21-.57-.345m-5.446 7.443h-.016c-1.77 0-3.524-.48-5.055-1.38l-.36-.214-3.75.975 1.005-3.645-.239-.375c-.99-1.576-1.516-3.391-1.516-5.26 0-5.445 4.455-9.885 9.942-9.885 2.654 0 5.145 1.035 7.021 2.91 1.875 1.859 2.909 4.35 2.909 6.99-.004 5.444-4.46 9.885-9.935 9.885M20.52 3.449C18.24 1.245 15.24 0 12.045 0 5.463 0 .104 5.334.101 11.893c0 2.096.549 4.14 1.595 5.945L0 24l6.335-1.652c1.746.943 3.71 1.444 5.71 1.447h.006c6.585 0 11.946-5.336 11.949-11.896 0-3.176-1.24-6.165-3.495-8.411"/></svg></span>

    </a>
    <a class="soc reveal" href="https://rubika.ir/Mehrad_01101" target="_blank" rel="noopener">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2H10l-5 4v-4H4a2 2 0 01-2-2V5a2 2 0 012-2zm5 4v7h2v-2.5h1.4L14 14h2.4l-2-3.2A2.2 2.2 0 0015 9.2C15 7.9 14.1 7 12.7 7H9zm2 1.7h1.5c.4 0 .6.2.6.6s-.2.6-.6.6H11V8.7z"/></svg></span>
      <strong>روبیکا</strong>
    </a>
    <a class="soc reveal" href="tel:+989336981515">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></span>
      <span><strong dir="ltr">۰۹۳۳ ۶۹۸ ۱۵۱۵</strong><small>شماره تماس</small></span>
    </a>
  </div>
</section>

<footer>
  ساخته‌شده با عشق توسط <b>مهراد مهری</b><br>
  پروژه مدرسه، کلاس هفتم، عرفان متوسطه ۱
</footer>

<script>
// soft reveal on scroll
const io = new IntersectionObserver((entries)=>{
  entries.forEach((e,i)=>{
    if(e.isIntersecting){
      setTimeout(()=>e.target.classList.add('on'), (e.target.dataset.d||0));
      io.unobserve(e.target);
    }
  });
},{threshold:.15});
document.querySelectorAll('.reveal').forEach((el,i)=>{
  el.dataset.d = (i%3)*120;
  io.observe(el);
});

</script>
</body>
</html>
